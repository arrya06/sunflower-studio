<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sunflower Studio — Get in Touch</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Work+Sans:wght@400;500;600&family=Space+Mono:wght@400;700&display=swap"
    rel="stylesheet">
  <style>
    :root {
      --bg: #FFFBF2;
      --gold: #F3B71E;
      --petal-orange: #E2790F;
      --stem-green: #3E5C3A;
      --ink: #2B2419;
      --brown: #8B5E34;
      --card: #FFFFFF;
      --focus: #E2790F;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--bg);
      font-family: 'Work Sans', sans-serif;
      color: var(--ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 48px 20px;
      position: relative;
      overflow-x: hidden;
    }

    /* Ambient field texture */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background-image:
        radial-gradient(circle at 12% 20%, rgba(243, 183, 30, 0.10) 0, transparent 40%),
        radial-gradient(circle at 85% 75%, rgba(226, 121, 15, 0.10) 0, transparent 45%);
      pointer-events: none;
      z-index: 0;
    }

    .wrap {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 920px;
      display: grid;
      grid-template-columns: 0.85fr 1.15fr;
      background: var(--card);
      border-radius: 28px;
      overflow: hidden;
      box-shadow: 0 30px 70px -30px rgba(43, 36, 25, 0.35);
    }

    /* Left panel */
    .intro {
      background: linear-gradient(165deg, #3E5C3A 0%, #2E4629 100%);
      color: #FBF6E9;
      padding: 52px 40px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
    }

    .eyebrow {
      font-family: 'Space Mono', monospace;
      font-size: 12px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--gold);
      margin-bottom: 18px;
    }

    .intro h1 {
      font-family: 'Fraunces', serif;
      font-optical-sizing: auto;
      font-weight: 600;
      font-size: clamp(30px, 4vw, 40px);
      line-height: 1.08;
      margin: 0 0 18px;
    }

    .intro p {
      font-size: 15px;
      line-height: 1.65;
      color: rgba(251, 246, 233, 0.82);
      margin: 0 0 32px;
      max-width: 32ch;
    }

    .bloom {
      width: 190px;
      height: 190px;
      margin-top: auto;
    }

    .contact-lines {
      font-family: 'Space Mono', monospace;
      font-size: 12.5px;
      line-height: 2;
      color: rgba(251, 246, 233, 0.75);
      margin-top: 28px;
    }

    .contact-lines a {
      color: var(--gold);
      text-decoration: none;
    }

    .contact-lines a:hover {
      text-decoration: underline;
    }

    /* Right panel: form */
    .form-side {
      padding: 52px 44px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .form-side h2 {
      font-family: 'Fraunces', serif;
      font-weight: 600;
      font-size: 24px;
      margin: 0 0 6px;
      color: var(--ink);
    }

    .form-side .sub {
      font-size: 14px;
      color: #6B6152;
      margin: 0 0 30px;
    }

    form {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    .field {
      position: relative;
    }

    label {
      display: block;
      font-family: 'Space Mono', monospace;
      font-size: 11px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--brown);
      margin-bottom: 7px;
    }

    input,
    textarea {
      width: 100%;
      border: 1.5px solid #E7DFCC;
      background: #FFFDF8;
      border-radius: 10px;
      padding: 12px 14px;
      font-family: 'Work Sans', sans-serif;
      font-size: 14.5px;
      color: var(--ink);
      transition: border-color 0.18s ease, box-shadow 0.18s ease;
    }

    input::placeholder,
    textarea::placeholder {
      color: #B7AD97;
    }

    textarea {
      resize: vertical;
      min-height: 110px;
    }

    input:focus,
    textarea:focus {
      outline: none;
      border-color: var(--focus);
      box-shadow: 0 0 0 4px rgba(226, 121, 15, 0.14);
    }

    button {
      margin-top: 6px;
      align-self: flex-start;
      background: var(--ink);
      color: #FBF6E9;
      border: none;
      padding: 14px 30px;
      border-radius: 999px;
      font-family: 'Work Sans', sans-serif;
      font-weight: 600;
      font-size: 14.5px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 10px;
      transition: transform 0.15s ease, background 0.15s ease;
    }

    button:hover {
      background: var(--petal-orange);
      transform: translateY(-1px);
    }

    button:active {
      transform: translateY(0);
    }

    button:focus-visible {
      outline: 3px solid var(--gold);
      outline-offset: 2px;
    }

    button svg {
      width: 16px;
      height: 16px;
      transition: transform 0.2s ease;
    }

    button:hover svg {
      transform: translateX(3px) rotate(8deg);
    }

    .status {
      font-family: 'Space Mono', monospace;
      font-size: 12.5px;
      color: var(--stem-green);
      min-height: 18px;
      margin-top: -4px;
    }

    /* Media Queries for Responsiveness */
    @media (max-width: 760px) {
      body {
        padding: 32px 16px;
      }

      .wrap {
        grid-template-columns: 1fr;
      }

      .intro {
        padding: 40px 28px;
      }

      .intro p {
        max-width: 100%;
        margin-bottom: 24px;
      }

      .bloom {
        position: absolute;
        top: 20px;
        right: -20px;
        width: 130px;
        height: 130px;
        opacity: 0.09;
        pointer-events: none;
        margin: 0;
        transform: rotate(15deg);
      }

      .contact-lines {
        margin-top: 24px;
      }

      .form-side {
        padding: 40px 28px;
      }
    }

    @media (max-width: 576px) {
      .row {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 480px) {
      body {
        padding: 20px 12px;
      }

      .wrap {
        border-radius: 20px;
      }

      .intro {
        padding: 32px 20px;
      }

      .form-side {
        padding: 32px 20px;
      }

      button {
        width: 100%;
        justify-content: center;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      * {
        transition: none !important;
        animation: none !important;
      }
    }
  </style>
</head>

<body>

  <div class="wrap">
    <div class="intro">
      <div>
        <div class="eyebrow">Sunflower Studio</div>
        <h1>Let's grow<br>something together.</h1>
        <p>Tell us about your project — brand, space, or story. We read every message and reply within two business
          days.</p>
      </div>

      <svg class="bloom" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <g id="petals">
          <!-- 10 petals arranged radially -->
          <g fill="#F3B71E">
            <ellipse cx="100" cy="40" rx="14" ry="30" />
            <ellipse cx="100" cy="40" rx="14" ry="30" transform="rotate(36 100 100)" />
            <ellipse cx="100" cy="40" rx="14" ry="30" transform="rotate(72 100 100)" />
            <ellipse cx="100" cy="40" rx="14" ry="30" transform="rotate(108 100 100)" />
            <ellipse cx="100" cy="40" rx="14" ry="30" transform="rotate(144 100 100)" />
            <ellipse cx="100" cy="40" rx="14" ry="30" transform="rotate(180 100 100)" />
            <ellipse cx="100" cy="40" rx="14" ry="30" transform="rotate(216 100 100)" />
            <ellipse cx="100" cy="40" rx="14" ry="30" transform="rotate(252 100 100)" />
            <ellipse cx="100" cy="40" rx="14" ry="30" transform="rotate(288 100 100)" />
            <ellipse cx="100" cy="40" rx="14" ry="30" transform="rotate(324 100 100)" />
          </g>
        </g>
        <circle cx="100" cy="100" r="30" fill="#7A4A22" />
        <circle cx="100" cy="100" r="30" fill="url(#seed)" />
        <defs>
          <radialGradient id="seed" cx="0.4" cy="0.4" r="0.7">
            <stop offset="0%" stop-color="#8B5E34" />
            <stop offset="100%" stop-color="#5C3D1F" />
          </radialGradient>
        </defs>
      </svg>

      <div class="contact-lines">
        hello@sunflowerstudio.co<br>
        +1 (555) 019-2044<br>
        <a href="#">@sunflower.studio</a>
      </div>
    </div>

    <div class="form-side">
      <h2>Start a conversation</h2>
      <p class="sub">Fill in a few details and we'll take it from here.</p>

      <form id="contactForm">
        <div class="row">
          <div class="field">
            <label for="name">Name</label>
            <input type="text" id="name" name="name" placeholder="Your full name" required>
          </div>
          <div class="field">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" placeholder="you@example.com" required>
          </div>
        </div>

        <div class="field">
          <label for="subject">Subject</label>
          <input type="text" id="subject" name="subject" placeholder="What's this about?" required>
        </div>

        <div class="field">
          <label for="message">Message</label>
          <textarea id="message" name="message" placeholder="Tell us a bit about your project or question..."
            required></textarea>
        </div>

        <button type="submit">
          Send message
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
            stroke-linejoin="round">
            <line x1="5" y1="12" x2="19" y2="12"></line>
            <polyline points="12 5 19 12 12 19"></polyline>
          </svg>
        </button>
        <div class="status" id="status" role="status" aria-live="polite"></div>
      </form>
    </div>
  </div>

  <script>
    const form = document.getElementById('contactForm');
    const status = document.getElementById('status');

    form.addEventListener('submit', function (e) {
      e.preventDefault();
      // Front-end only demo: wire this up to your backend or a form service (e.g. Formspree) to actually send messages.
      status.textContent = "Message sent — we'll be in touch soon.";
      form.reset();
    });
  </script>

</body>

</html>
